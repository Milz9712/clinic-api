name: Build Docker image

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::530839979860:role/github-actions-clinic-api
          aws-region: eu-west-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: docker build --provenance=false -t ${{ steps.ecr.outputs.registry }}/clinic-api:${{ github.sha }} .
      - run: docker push ${{ steps.ecr.outputs.registry }}/clinic-api:${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: 
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: psql "$DATABASE_URL" -f schema.sql
      - run: pytest